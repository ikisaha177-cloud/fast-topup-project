if" font-size="19" fill="#555">A hex token with a top-up arrow cut clean</text><text x="1095.3333333333335" y="696" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">through it: instant credit, in-game.</text></svg>
