; Supervisor untuk queue worker TopUpMarket (email notifikasi).
;
; Salin ke /etc/supervisor/conf.d/topupmarket.conf (Linux), sesuaikan path & user.
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start topupmarket-worker:*

[program:topupmarket-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/topup-market/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/topup-market
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/topup-market/storage/logs/worker.log
stopwaitsecs=3600
