; Supervisor untuk queue worker FastTopup Store (email notifikasi).
;
; Salin ke /etc/supervisor/conf.d/FastTopup.conf (Linux), sesuaikan path & user.
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start FastTopup-worker:*

[program:FastTopup-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/FastTopup-store/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/FastTopup-store
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/FastTopup-store/storage/logs/worker.log
stopwaitsecs=3600

