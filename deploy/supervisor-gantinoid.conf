; Supervisor untuk queue worker GantinoID Store (email notifikasi).
;
; Salin ke /etc/supervisor/conf.d/gantinoid.conf (Linux), sesuaikan path & user.
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start gantinoid-worker:*

[program:gantinoid-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/gantinoid-store/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/gantinoid-store
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/gantinoid-store/storage/logs/worker.log
stopwaitsecs=3600
